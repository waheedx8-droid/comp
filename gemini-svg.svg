<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- خلفية تدرج رقمي واحترافي -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    
    <!-- تدرج انستغرام -->
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
  </defs>

  <!-- خلفية الأيقونة الدائرية -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="12" />

  <!-- 1. رمز فيسبوك (Facebook Ad Card) في اليسار -->
  <g transform="translate(90, 130)">
    <rect x="0" y="0" width="130" height="150" rx="16" fill="#1877F2" />
    <!-- خطوط المنشور -->
    <rect x="18" y="25" width="60" height="12" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="18" y="48" width="94" height="8" rx="4" fill="#ffffff" opacity="0.6" />
    <!-- صندوق الصورة الإعلانية -->
    <rect x="18" y="70" width="94" height="60" rx="8" fill="#ffffff" opacity="0.2" />
    <!-- شارة Sponsored / Ad -->
    <text x="35" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="16">AD</text>
  </g>

  <!-- 2. رمز إنستغرام (Instagram Post) في اليمين الأعلى -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#instaGrad)" />
    <!-- عدسة الكاميرا / شكل المنشور -->
    <circle cx="60" cy="60" r="32" fill="none" stroke="#ffffff" stroke-width="12" />
    <circle cx="92" cy="32" r="8" fill="#ffffff" />
  </g>

  <!-- 3. رمز تويتر / إكس (Twitter Post Card) في الأسفل -->
  <g transform="translate(210, 260)">
    <rect x="0" y="0" width="170" height="110" rx="16" fill="#ffffff" />
    <!-- طائر تويتر أو علامة التغريدة المبسطة -->
    <path d="M35 30 C50 25 65 35 60 55 C75 50 85 35 90 25 C85 40 75 55 65 60 C75 75 95 85 115 85 C95 95 70 90 50 75 C30 90 10 70 25 50 C15 45 25 35 35 30 Z" fill="#1DA1F2" transform="scale(0.8) translate(15, 10)" />
    <!-- خطوط نص المنشور -->
    <rect x="75" y="30" width="70" height="10" rx="5" fill="#1DA1F2" opacity="0.8" />
    <rect x="75" y="50" width="50" height="8" rx="4" fill="#ccd6dd" />
  </g>

</svg>
